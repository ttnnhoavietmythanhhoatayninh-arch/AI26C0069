<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1980" viewBox="0 0 1400 1980"><rect x="0" y="0" width="1400" height="1980" rx="0" fill="#0b1528" stroke="none"/><rect x="80" y="75" width="340" height="56" rx="28" fill="#18334a" stroke="none"/><text x="103" y="112" fill="#72e9d0" font-size="23" font-weight="700" font-family="DejaVu Sans, sans-serif">AI26C0069 · EXCEL QA</text><text x="80" y="245" fill="#e7f0ff" font-size="98" font-weight="700" font-family="DejaVu Sans, sans-serif">HỎI ĐÁP</text><text x="80" y="355" fill="#e7f0ff" font-size="86" font-weight="700" font-family="DejaVu Sans, sans-serif">BẢNG TÍNH EXCEL</text><text x="84" y="425" fill="#a9bcd5" font-size="29" font-weight="400" font-family="DejaVu Sans, sans-serif">Đọc bảng đúng. Tính từ ô nguồn. Kiểm tra kết quả.</text><rect x="80" y="490" width="1240" height="240" rx="20" fill="#14263e" stroke="none"/><text x="120" y="547" fill="#72e9d0" font-size="23" font-weight="700" font-family="DejaVu Sans, sans-serif">QUY TRÌNH GIẢI BÀI</text><text x="120" y="610" fill="#72e9d0" font-size="27" font-weight="700" font-family="DejaVu Sans, sans-serif">01</text><text x="120" y="655" fill="#e7f0ff" font-size="25" font-weight="700" font-family="DejaVu Sans, sans-serif">Excel + câu hỏi</text><text x="120" y="693" fill="#a9bcd5" font-size="18" font-weight="400" font-family="DejaVu Sans, sans-serif">Nhiều sheet, ô gộp</text><text x="425" y="610" fill="#72e9d0" font-size="27" font-weight="700" font-family="DejaVu Sans, sans-serif">02</text><text x="425" y="655" fill="#e7f0ff" font-size="25" font-weight="700" font-family="DejaVu Sans, sans-serif">Python</text><text x="425" y="693" fill="#a9bcd5" font-size="18" font-weight="400" font-family="DejaVu Sans, sans-serif">Tra cứu và tính toán</text><text x="730" y="610" fill="#72e9d0" font-size="27" font-weight="700" font-family="DejaVu Sans, sans-serif">03</text><text x="730" y="655" fill="#e7f0ff" font-size="25" font-weight="700" font-family="DejaVu Sans, sans-serif">Qwen khi cần</text><text x="730" y="693" fill="#a9bcd5" font-size="18" font-weight="400" font-family="DejaVu Sans, sans-serif">Kế hoạch JSON</text><text x="1035" y="610" fill="#72e9d0" font-size="27" font-weight="700" font-family="DejaVu Sans, sans-serif">04</text><text x="1035" y="655" fill="#e7f0ff" font-size="25" font-weight="700" font-family="DejaVu Sans, sans-serif">CSV</text><text x="1035" y="693" fill="#a9bcd5" font-size="18" font-weight="400" font-family="DejaVu Sans, sans-serif">id,answer · UTF-8</text><text x="80" y="825" fill="#72e9d0" font-size="28" font-weight="700" font-family="DejaVu Sans, sans-serif">KẾT QUẢ ĐÃ ĐO · KHÔNG GỌI API</text><rect x="80" y="870" width="600" height="235" rx="20" fill="#182b44" stroke="none"/><text x="122" y="985" fill="#e7f0ff" font-size="86" font-weight="700" font-family="DejaVu Sans, sans-serif">20/20</text><text x="124" y="1055" fill="#a9bcd5" font-size="24" font-weight="400" font-family="DejaVu Sans, sans-serif">Dữ liệu công khai đợt 1</text><rect x="720" y="870" width="600" height="235" rx="20" fill="#182b44" stroke="none"/><text x="762" y="985" fill="#e7f0ff" font-size="86" font-weight="700" font-family="DejaVu Sans, sans-serif">30/30</text><text x="764" y="1055" fill="#a9bcd5" font-size="24" font-weight="400" font-family="DejaVu Sans, sans-serif">Dữ liệu công khai đợt 2</text><text x="85" y="1155" fill="#e7f0ff" font-size="24" font-weight="400" font-family="DejaVu Sans, sans-serif">113 test đạt · Có bằng chứng ô nguồn · Không thực thi mã do LLM sinh</text><text x="85" y="1200" fill="#a9bcd5" font-size="23" font-weight="400" font-family="DejaVu Sans, sans-serif">Public 1 giải đủ 20 câu; public 2 giải đủ 30 câu.</text><text x="85" y="1243" fill="#a9bcd5" font-size="22" font-weight="400" font-family="DejaVu Sans, sans-serif">Kết quả offline không đại diện điểm tập ẩn hoặc chất lượng Qwen.</text><rect x="80" y="1310" width="1240" height="360" rx="20" fill="#14263e" stroke="none"/><text x="120" y="1373" fill="#72e9d0" font-size="28" font-weight="700" font-family="DejaVu Sans, sans-serif">HAI CÁCH SỬ DỤNG</text><text x="120" y="1440" fill="#e7f0ff" font-size="28" font-weight="700" font-family="DejaVu Sans, sans-serif">LOCAL</text><text x="120" y="1484" fill="#e7f0ff" font-size="25" font-weight="400" font-family="DejaVu Sans, sans-serif">Giao diện Python tùy chọn · Offline hoặc hybrid</text><text x="120" y="1555" fill="#e7f0ff" font-size="28" font-weight="700" font-family="DejaVu Sans, sans-serif">BÀI CHẤM</text><text x="120" y="1599" fill="#e7f0ff" font-size="25" font-weight="400" font-family="DejaVu Sans, sans-serif">Docker Linux amd64 · CLI nhận sáu tham số BTC</text><text x="80" y="1760" fill="#e7f0ff" font-size="35" font-weight="700" font-family="DejaVu Sans, sans-serif">Minh bạch về chi phí và giới hạn</text><text x="80" y="1818" fill="#a9bcd5" font-size="23" font-weight="400" font-family="DejaVu Sans, sans-serif">Offline: không phí API. Hybrid: chỉ mô hình BTC quy định, có thể tính phí.</text><text x="80" y="1861" fill="#a9bcd5" font-size="23" font-weight="400" font-family="DejaVu Sans, sans-serif">API thật bản cũ: 3/5 đúng; bản vá mới chưa thử lại API.</text><text x="80" y="1920" fill="#72e9d0" font-size="21" font-weight="400" font-family="DejaVu Sans, sans-serif">github.com/ttnnhoavietmythanhhoatayninh-arch/AI26C0069</text></svg>