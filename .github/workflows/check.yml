name: Validate source and Docker
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-index --find-links dependency_wheels --require-hashes -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/smoke_container.py
      - run: python tools/package.py --team AI26C0069 --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: AI26C0069-submission
          path: dist/AI26C0069.zip
